services:
  primary:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./examples:/app:ro
    environment:
      ROLE: primary
      PORT: "9101"
    command: python echo_server.py

  shadow:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./examples:/app:ro
    environment:
      ROLE: shadow
      PORT: "9102"
    command: python echo_server.py

  proxy:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./capture:/var/lib/apishadow
    command: ["-config", "/etc/apishadow/apishadow.compose.conf"]
    depends_on:
      - primary
      - shadow
